<meta property="og:description" content="বাংলাদেশের ১ নম্বর DLS Tournament BD - KICKFEST DLS TOUR BD তে যোগ দিন এবং ১ভি১ ম্যাচে অংশ নিন।">

<style>
  :root{
    --bg: #060a10;
    --grid: #101823;
    --cyan: #22d3ee;
    --magenta: #ec4899;
    --violet: #8b5cf6;
    --text: #f3f6fa;
    --muted: #6b7686;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'Inter', sans-serif;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* faint tactical grid, like a pitch laid out under the UI */
  .grid-field{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black 5%, transparent 70%);
            mask-image: radial-gradient(circle at 50% 45%, black 5%, transparent 70%);
    opacity:0;
    animation: gridIn 1.4s ease-out forwards;
  }

  @keyframes gridIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: 0 28px;
  }

  /* the ring: a rotating conic gradient, masked into a ring shape */
  .ring-wrap{
    position:relative;
    width: 168px; height: 168px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 34px;
    opacity:0;
    transform: scale(0.82);
    animation: ringIn 0.7s cubic-bezier(.2,.9,.3,1.1) 0.15s forwards;
  }

  @keyframes ringIn{
    to{ opacity:1; transform: scale(1); }
  }

  .ring{
    position:absolute; inset:0;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
    filter: blur(0.3px);
    animation: spin 3.2s linear infinite;
  }

  .ring::after{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    background: var(--bg);
    box-shadow: inset 0 0 24px rgba(0,0,0,0.6);
  }

  .ring-glow{
    position:absolute; inset:-18px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
    filter: blur(26px);
    opacity:0.55;
    animation: spin 3.2s linear infinite;
  }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  .logo-img{
    position:relative;
    width: 146px; height: 146px;
    border-radius: 50%;
    object-fit: cover;
    z-index:2;
    animation: spinReverse 8s linear infinite;
  }

  @keyframes spinReverse{
    to{ transform: rotate(-360deg); }
  }

  .title{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 44px);
    letter-spacing: 0.5px;
    color: var(--text);
    line-height: 1.15;
    opacity:0;
    transform: translateY(10px);
    animation: riseIn 0.6s ease-out 0.55s forwards;
  }

  .title .accent{
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle{
    margin-top: 14px;
    font-size: 14px;
    letter-spacing: 1.5px;
    color: var(--muted);
    opacity:0;
    transform: translateY(8px);
    animation: riseIn 0.6s ease-out 0.8s forwards;
  }

  .subtitle b{
    color: var(--magenta);
    font-weight: 600;
  }

  @keyframes riseIn{
    to{ opacity:1; transform: translateY(0); }
  }

  .status{
    position:absolute;
    bottom: 54px;
    left:0; right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    opacity:0;
    animation: riseIn 0.6s ease-out 1.05s forwards;
  }

  .status-text{
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .bar{
    width: 140px;
    height: 3px;
    border-radius: 2px;
    background: var(--grid);
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    width:0%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    animation: fill 1.9s ease-in-out 1.05s forwards;
  }

  @keyframes fill{
    to{ width:100%; }
  }

  /* whole screen fade-out before handing off to auth.html */
  .fade-out{
    animation: fadeOut 0.5s ease-in forwards;
  }

  @keyframes fadeOut{
    to{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .ring, .ring-glow, .logo-img{ animation: none; }
    .grid-field, .title, .subtitle, .status, .ring-wrap{ animation-duration: 0.01s; }
  }
</style>
</head>
<body id="body">

  <div class="grid-field"></div>

  <div class="stage">
    <div class="ring-wrap">
      <div class="ring-glow"></div>
      <div class="ring"></div>
      <img class="logo-img" src="logo.jpg" alt="DLS Tournament BD" width="146" height="146">
    </div>

    <div class="title">DLS <span class="accent">TOURNAMENT</span> BD</div>
    <div class="subtitle">PRODUCED BY <b>MOSADDIQUL HAQUE</b></div>
  </div>

  <div class="status">
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="status-text" id="statusText">টুর্নামেন্ট প্রস্তুত হচ্ছে…</div>
  </div>

<script>
  // ---- Firebase config (this project's own keys go here) ----
  // Replace with your actual Firebase project config from the console.
  const firebaseConfig = {
    apiKey: "AIzaSyDMt3Ra3GMGS4uwn6-LGHwOw4XuFIcR-aE",
    authDomain: "dls-tournament-bd-d8f0a.firebaseapp.com",
    databaseURL: "https://dls-tournament-bd-d8f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dls-tournament-bd-d8f0a",
    storageBucket: "dls-tournament-bd-d8f0a.firebasestorage.app",
    messagingSenderId: "705815077213",
    appId: "1:705815077213:web:6e6df3452b17147a3648b4"
  };
  // Firebase SDK is not initialized on this page since the splash screen
  // itself doesn't need the database — it only announces the app and
  // hands off to auth.html, which will initialize Firebase itself.

  // ---- status messages, shown in sequence while the bar fills ----
  const statusMessages = [
    "টুর্নামেন্ট প্রস্তুত হচ্ছে…",
    "প্লেয়ার ডেটা লোড হচ্ছে…",
    "সবকিছু প্রস্তুত"
  ];

  const statusEl = document.getElementById('statusText');
  let step = 0;
  const stepInterval = setInterval(() => {
    step++;
    if (step < statusMessages.length){
      statusEl.style.opacity = 0;
      setTimeout(() => {
        statusEl.textContent = statusMessages[step];
        statusEl.style.transition = 'opacity 0.25s ease';
        statusEl.style.opacity = 1;
      }, 180);
    }
  }, 950);

  // ---- hand off to the auth page once the intro has played out ----
  const TOTAL_SPLASH_MS = 3200;

  setTimeout(() => {
    clearInterval(stepInterval);
    document.getElementById('body').classList.add('fade-out');
    setTimeout(() => {
      window.location.href = "auth.html";
    }, 480);
  }, TOTAL_SPLASH_MS);
</script>

</body>
</html>
