<meta name="description" content="KICKFEST DLS TOUR BD (Kickfest Dls Tour) - বাংলাদেশের ১ নম্বর DLS Tournament BD। DLS Tour BD ও Dream League Soccer Bangladesh এর সবচেয়ে জনপ্রিয় ১ভি১ ম্যাচ প্ল্যাটফর্ম। এখনই লগইন বা রেজিস্ট্রেশন করে ম্যাচে অংশ নিন।">

<style>
  :root{
    --bg: #060a10;
    --grid: #101823;
    --cyan: #22d3ee;
    --magenta: #ec4899;
    --violet: #8b5cf6;
    --text: #f3f6fa;
    --muted: #7b869a;
    --card: rgba(13,18,28,0.78);
    --field: rgba(255,255,255,0.04);
    --field-border: rgba(255,255,255,0.09);
    --danger: #f43f5e;
    --success: #34d399;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; min-height:100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 18px;
    overflow-x:hidden;
  }

  /* ---- App download top bar ---- */
  .download-bar{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding: 12px 16px;
    background: linear-gradient(90deg, rgba(34,211,238,0.16), rgba(139,92,246,0.16), rgba(236,72,153,0.16));
    border-bottom: 1px solid rgba(34,211,238,0.22);
    backdrop-filter: blur(10px);
  }

  .download-bar .app-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 9px 18px;
    border:none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color:#fff;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13.5px;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(34,211,238,0.25);
    transition: transform 0.15s ease;
  }
  .download-bar .app-btn:active{ transform: scale(0.97); }
  .download-bar .app-btn svg{ width:16px; height:16px; }

  /* pushes page content below the fixed bar */
  body{ padding-top: 66px; }

  .grid-field{
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(circle at 50% 30%, black 5%, transparent 72%);
            mask-image: radial-gradient(circle at 50% 30%, black 5%, transparent 72%);
    z-index:0;
  }

  .glow-blob{
    position:fixed;
    width:340px; height:340px;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.28;
    z-index:0;
  }
  .glow-blob.one{ background: var(--cyan); top:-80px; left:-80px; }
  .glow-blob.two{ background: var(--magenta); bottom:-100px; right:-80px; }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid rgba(34,211,238,0.16);
    border-radius: 22px;
    padding: 34px 26px 30px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 30px 60px rgba(0,0,0,0.45);
    animation: cardIn 0.5s cubic-bezier(.2,.9,.3,1.1);
  }

  @keyframes cardIn{
    from{ opacity:0; transform: translateY(14px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 26px;
  }

  .ring-wrap{
    position:relative;
    width: 92px; height: 92px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 16px;
  }

  .ring{
    position:absolute; inset:0;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
    animation: spin 5s linear infinite;
  }

  .ring::after{
    content:"";
    position:absolute; inset:6px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #1c2a44, #0c1220);
  }

  .ring-glow{
    position:absolute; inset:-10px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
    filter: blur(18px);
    opacity:0.55;
    animation: spin 5s linear infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .logo-img{
    position:relative;
    width: 78px; height: 78px;
    border-radius: 50%;
    object-fit: cover;
    z-index:2;
    animation: spinReverse 8s linear infinite;
  }
  @keyframes spinReverse{ to{ transform: rotate(-360deg); } }

  .brand-title{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 28px;
    letter-spacing: 0.5px;
  }
  .brand-title .accent{ color: var(--cyan); }

  .brand-subtitle{
    margin-top:6px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  .tabs{
    display:flex;
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 14px;
    padding: 4px;
    gap:4px;
    margin-bottom: 22px;
  }

  .tab-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding: 11px 8px;
    border:none;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 14px;
    cursor:pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }

  .tab-btn svg{ width:15px; height:15px; }

  .tab-btn.active{
    color:#fff;
    background: linear-gradient(135deg, rgba(34,211,238,0.28), rgba(139,92,246,0.28));
    box-shadow: inset 0 0 0 1px rgba(34,211,238,0.35);
  }

  .panel{ display:none; }
  .panel.active{ display:block; animation: panelIn 0.3s ease; }

  @keyframes panelIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .field-group{ margin-bottom: 16px; }

  .field-label{
    display:block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .field-input{
    position:relative;
    display:flex;
    align-items:center;
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 12px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .field-input:focus-within{
    border-color: rgba(34,211,238,0.5);
    box-shadow: 0 0 0 3px rgba(34,211,238,0.12);
  }

  .field-input .icon{
    width:38px;
    display:flex; align-items:center; justify-content:center;
    color: var(--muted);
    flex-shrink:0;
  }
  .field-input .icon svg{ width:17px; height:17px; }

  .field-input input{
    flex:1;
    background: transparent;
    border:none;
    outline:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size: 14.5px;
    padding: 13px 6px 13px 0;
    min-width:0;
  }

  .field-input input::placeholder{ color: rgba(123,134,154,0.7); letter-spacing:0.3px; }

  .toggle-eye{
    width:38px;
    display:flex; align-items:center; justify-content:center;
    color: var(--muted);
    background:none; border:none; cursor:pointer;
    flex-shrink:0;
  }
  .toggle-eye svg{ width:17px; height:17px; }

  .forgot-link{
    display:block;
    text-align:right;
    font-size: 13px;
    color: var(--cyan);
    margin: -4px 0 18px;
    background:none; border:none; cursor:pointer;
    font-family:'Inter', sans-serif;
    padding:0;
  }

  .submit-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 15px;
    border:none;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color:#fff;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 15px;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 10px 24px rgba(34,211,238,0.18);
  }
  .submit-btn svg{ width:17px; height:17px; }

  .submit-btn:active{ transform: scale(0.98); }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  .back-link{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 13.5px;
    color: var(--muted);
    background:none; border:none; cursor:pointer;
    margin-bottom: 18px;
    font-family:'Inter', sans-serif;
  }
  .back-link svg{ width:14px; height:14px; }

  .panel-hint{
    font-size: 13px;
    color: var(--muted);
    line-height:1.6;
    margin-bottom: 20px;
  }

  .field-note{
    font-size:12px;
    color: var(--muted);
    margin-top:6px;
  }

  /* toast notifications */
  .toast-stack{
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    z-index: 50;
    display:flex;
    flex-direction:column;
    gap:10px;
    width: min(360px, 92vw);
  }

  .toast{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background: rgba(15,20,30,0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-left: 3px solid var(--cyan);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 13.5px;
    line-height:1.5;
    box-shadow: 0 14px 30px rgba(0,0,0,0.4);
    animation: toastIn 0.28s ease;
    backdrop-filter: blur(10px);
  }
  .toast.error{ border-left-color: var(--danger); }
  .toast.success{ border-left-color: var(--success); }

  .toast .icon{ flex-shrink:0; margin-top:1px; }
  .toast .icon svg{ width:16px; height:16px; }
  .toast.error .icon{ color: var(--danger); }
  .toast.success .icon{ color: var(--success); }
  .toast.info .icon{ color: var(--cyan); }

  @keyframes toastIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .toast.out{ animation: toastOut 0.24s ease forwards; }
  @keyframes toastOut{
    to{ opacity:0; transform: translateY(-6px); }
  }

  @media (max-width: 380px){
    .card{ padding: 28px 18px 24px; }
    .download-bar .app-btn{ font-size:12.5px; padding:8px 14px; }
  }
</style>
</head>

<script>
  // ---- Firebase config (this project's own keys) ----
  const firebaseConfig = {

    authDomain: "dls-tournament-bd-d8f0a.firebaseapp.com",
    databaseURL: "https://dls-tournament-bd-d8f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dls-tournament-bd-d8f0a",
    storageBucket: "dls-tournament-bd-d8f0a.firebasestorage.app",
    messagingSenderId: "705815077213",
    appId: "1:705815077213:web:6e6df3452b17147a3648b4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ---- already logged in? skip straight to home ----
  // Session stays in localStorage until the user logs out themselves —
  // it is never cleared automatically.
  if (localStorage.getItem('gf_session_phone')){
    window.location.href = 'home.html';
  }

  // =========================================================
  // ---- App download button logic ----
  // This site becomes the "app" via PWA install (Add to Home
  // Screen) — no separate .apk needed. Requires this page to be
  // served over HTTPS together with manifest.json and
  // service-worker.js in the same folder.
  //
  // 1) Chrome/Edge/most Android browsers: fire the native
  //    "beforeinstallprompt" and show it when the button is tapped.
  // 2) iOS Safari and any browser that never fires that event:
  //    there is no programmatic install API, so show a short
  //    on-screen instruction instead.
  // =========================================================
  let deferredInstallPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }

  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  async function downloadApp(){
    if (deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      if (choice.outcome === 'accepted'){
        showToast('অ্যাপ ইনস্টল হচ্ছে…', 'success');
      }
      deferredInstallPrompt = null;
    } else if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
      showToast('অ্যাপটি ইতিমধ্যে ইনস্টল করা আছে।', 'info');
    } else if (isIOS()){
      showToast('নিচের শেয়ার (Share) বাটনে চাপ দিয়ে "Add to Home Screen" সিলেক্ট করুন।', 'info', 5000);
    } else {
      showToast('আপনার ব্রাউজারের মেনু থেকে "Install app" / "Add to Home Screen" সিলেক্ট করুন।', 'info', 5000);
    }
  }

  // ---- toast notifications ----
  const toastIcons = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };

  function showToast(message, type = 'info', duration = 3200){
    const stack = document.getElementById('toastStack');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span class="icon">${toastIcons[type]}</span><span>${message}</span>`;
    stack.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('out');
      setTimeout(() => toast.remove(), 240);
    }, duration);
  }

  // ---- tab / panel switching ----
  function showPanel(name){
    document.getElementById('panelLogin').classList.remove('active');
    document.getElementById('panelRegister').classList.remove('active');
    document.getElementById('tabLoginBtn').classList.remove('active');
    document.getElementById('tabRegisterBtn').classList.remove('active');

    if (name === 'login'){
      document.getElementById('panelLogin').classList.add('active');
      document.getElementById('tabLoginBtn').classList.add('active');
    } else if (name === 'register'){
      document.getElementById('panelRegister').classList.add('active');
      document.getElementById('tabRegisterBtn').classList.add('active');
    }
  }

  // ---- forgot password → hand off to WhatsApp support ----
  function openForgotWhatsApp(){
    const phone = document.getElementById('loginPhone').value.trim();
    let message = 'আসসালামু আলাইকুম, আমি DLS Tournament BD-এর পাসওয়ার্ড রিসেট করতে চাই।';
    if (phone) message += ' আমার মোবাইল নম্বর: ' + phone;
    const url = 'https://wa.me/8801859793158?text=' + encodeURIComponent(message);
    window.open(url, '_blank');
  }

  function toggleEye(inputId, btn){
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.innerHTML = isHidden
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  }

  // ---- helpers ----
  function isValidPhone(phone){
    return /^01[3-9][0-9]{8}$/.test(phone);
  }
  function isValidSixDigit(pw){
    return /^[0-9]{6}$/.test(pw);
  }

  async function hashPassword(password){
    const data = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function setLoading(btn, isLoading, originalHTML){
    if (isLoading){
      btn.dataset.originalHtml = btn.innerHTML;
      btn.innerHTML = 'অপেক্ষা করুন…';
      btn.disabled = true;
    } else {
      btn.innerHTML = btn.dataset.originalHtml || originalHTML;
      btn.disabled = false;
    }
  }

  // ---- registration ----
  async function handleRegister(){
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const btn = document.getElementById('registerBtn');

    if (!name){ showToast('নাম লেখা বাকি আছে।', 'error'); return; }
    if (!isValidPhone(phone)){ showToast('সঠিক ফরম্যাটে ১১ সংখ্যার মোবাইল নম্বর দিন।', 'error'); return; }
    if (!isValidSixDigit(password)){ showToast('পাসওয়ার্ড অবশ্যই ৬টি সংখ্যার হতে হবে।', 'error'); return; }

    setLoading(btn, true);
    try{
      const snapshot = await db.ref('users/' + phone).get();
      if (snapshot.exists()){
        showToast('এই নম্বরটি দিয়ে আগেই একটি একাউন্ট খোলা হয়েছে।', 'error');
        return;
      }
      const passwordHash = await hashPassword(password);
      await db.ref('users/' + phone).set({
        name: name,
        phone: phone,
        passwordHash: passwordHash,
        winningBalance: 0,
        depositBalance: 0,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      showToast('একাউন্ট তৈরি সম্পন্ন হয়েছে। এখন লগইন করুন।', 'success');
      document.getElementById('regName').value = '';
      document.getElementById('regPhone').value = '';
      document.getElementById('regPassword').value = '';
      showPanel('login');
      document.getElementById('loginPhone').value = phone;
    } catch(err){
      showToast('একাউন্ট তৈরি করা যায়নি। আবার চেষ্টা করুন।', 'error');
      console.error(err);
    } finally {
      setLoading(btn, false);
    }
  }

  // ---- login ----
  async function handleLogin(){
    const phone = document.getElementById('loginPhone').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const btn = document.getElementById('loginBtn');

    if (!isValidPhone(phone)){ showToast('সঠিক ফরম্যাটে মোবাইল নম্বর দিন।', 'error'); return; }
    if (!password){ showToast('পাসওয়ার্ড লেখা বাকি আছে।', 'error'); return; }

    setLoading(btn, true);
    try{
      const snapshot = await db.ref('users/' + phone).get();
      if (!snapshot.exists()){
        showToast('এই নম্বরে কোনো একাউন্ট পাওয়া যায়নি।', 'error');
        return;
      }
      const user = snapshot.val();
      const passwordHash = await hashPassword(password);
      if (user.passwordHash !== passwordHash){
        showToast('পাসওয়ার্ড সঠিক নয়।', 'error');
        return;
      }
      localStorage.setItem('gf_session_phone', phone);
      localStorage.setItem('gf_session_name', user.name);
      showToast('স্বাগতম, ' + user.name + '!', 'success');
      setTimeout(() => { window.location.href = 'home.html'; }, 700);
    } catch(err){
      showToast('লগইন করা যায়নি। আবার চেষ্টা করুন।', 'error');
      console.error(err);
    } finally {
      setLoading(btn, false);
    }
  }


</script>
